name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil file repository
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Ekstrak proyek
        run: unzip -q ExamAIStudio_HP_CloudBuild.zip

      - name: Build APK
        working-directory: ExamAIStudio
        run: gradle assembleDebug

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamAIStudio-debug
          path: ExamAIStudio/app/build/outputs/apk/debug/app-debug.apk
